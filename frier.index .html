<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frier - Ad Skills</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Frier</h1>
    <p>Show Your Creativity</p>
    <a href="#upload" class="btn">Upload Your Ad +</a>
</header>

<section class="hero">
    <h2>Welcome to Frier</h2>
    <p>Share your designs and connect with people on WhatsApp.</p>
</section>

<section class="container">
    <h2>Explore Designs</h2>
    <input type="text" id="search" placeholder="Search designs...">
    <div id="gallery" class="gallery"></div>
</section>

<section id="upload" class="upload">
    <h2>Upload Your Design</h2>

    <input id="title" placeholder="Design title">
    <input id="creator" placeholder="Your name">
    <input id="phone" placeholder="WhatsApp number with country code">
    <input id="photo" type="file" accept="image/*">
    
    <button class="btn" onclick="addDesign()">Publish Design</button>
</section>

<footer>
    <p>© 2026 Frier | Creative Ads Marketplace</p>
</footer>

<script src="script.js"></script>
</body>
</html>
